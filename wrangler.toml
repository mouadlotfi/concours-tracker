name = "concours-tracker"
compatibility_date = "2026-07-06"
compatibility_flags = [ "nodejs_compat" ]

# Run locally or via CF Workers
main = "src/index.tsx"

[dev]
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "concours-db"
database_id = "54db175f-a5ba-40e1-80f3-010e1e42a1d8"
migrations_dir = "migrations"

[triggers]
# Every 5 hours: scrape and merge fresh listings.
# Hourly: notification pass. Sends only during NOTIFY_HOURS in NOTIFY_TIMEZONE.
crons = ["0 */5 * * *", "0 * * * *"]

[assets]
directory = "./public"

[vars]
# You can set vars here, secrets should be set via `wrangler secret put`
# For local dev, put secrets in .env.dev (see .env.dev.example)
OPENROUTER_MODEL = "openrouter/free"
# Local slots (hours) during which notification emails may be sent.
NOTIFY_HOURS = "8,18"
NOTIFY_TIMEZONE = "Africa/Casablanca"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05
